<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">波形与最小ISL滤波联合设计流程</title>
  <desc id="desc">基于论文第3节的NLFM与最小ISL滤波器联合调谐流程。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offsetBlur"/>
      <feFlood flood-color="#123B5D" flood-opacity="0.12" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowBlur"/>
      <feMerge><feMergeNode in="shadowBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D78A8"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8F4FA"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#17324D">
    
    <text x="92" y="78" font-size="24" font-weight="700" fill="#1D78A8" letter-spacing="2">JOINT OPTIMIZATION · A 类原创图</text>
    <text x="92" y="132" font-size="44" font-weight="700">波形与最小 ISL 滤波器的联合设计</text>
    <line x1="92" y1="158" x2="1508" y2="158" stroke="#C7DCE7" stroke-width="2"/>
    <rect x="80" y="230" width="300" height="190" rx="22" fill="#FFFFFF" stroke="#C7DCE7" stroke-width="2" filter="url(#shadow)"/>
<rect x="80" y="230" width="10" height="190" rx="5" fill="#123B5D"/>
<text x="114" y="278" font-size="27" font-weight="700">1  输入约束</text>
<text x="114" y="318" font-size="20" fill="#60798E">灵敏度 / 盲区</text>
<text x="114" y="352" font-size="20" fill="#60798E">B、T、fₛ 与硬件边界</text><rect x="455" y="230" width="300" height="190" rx="22" fill="#FFFFFF" stroke="#C7DCE7" stroke-width="2" filter="url(#shadow)"/>
<rect x="455" y="230" width="10" height="190" rx="5" fill="#1D78A8"/>
<text x="489" y="278" font-size="27" font-weight="700">2  构造 NLFM</text>
<text x="489" y="318" font-size="20" fill="#60798E">调谐 αT、kT、kB</text>
<text x="489" y="352" font-size="20" fill="#60798E">生成 g(t) 与发射谱</text><rect x="830" y="230" width="300" height="190" rx="22" fill="#FFFFFF" stroke="#C7DCE7" stroke-width="2" filter="url(#shadow)"/>
<rect x="830" y="230" width="10" height="190" rx="5" fill="#39B9C6"/>
<text x="864" y="278" font-size="27" font-weight="700">3  解最小 ISL</text>
<text x="864" y="318" font-size="20" fill="#60798E">由发射卷积矩阵 G</text>
<text x="864" y="352" font-size="20" fill="#60798E">求有限长 FIR 滤波器 h</text><rect x="1205" y="230" width="300" height="190" rx="22" fill="#FFFFFF" stroke="#C7DCE7" stroke-width="2" filter="url(#shadow)"/>
<rect x="1205" y="230" width="10" height="190" rx="5" fill="#F39C45"/>
<text x="1239" y="278" font-size="27" font-weight="700">4  评估</text>
<text x="1239" y="318" font-size="20" fill="#60798E">PSL / ISL / SNR 损失</text>
<text x="1239" y="352" font-size="20" fill="#60798E">分辨率 / 有限带宽</text><path d="M 380 325 L 445 325" fill="none" stroke="#1D78A8" stroke-width="4" marker-end="url(#arrow)"/><path d="M 755 325 L 820 325" fill="none" stroke="#1D78A8" stroke-width="4" marker-end="url(#arrow)"/><path d="M 1130 325 L 1195 325" fill="none" stroke="#1D78A8" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 1355 430 C 1355 590, 600 600, 600 445" fill="none" stroke="#F39C45" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
    <text x="980" y="580" text-anchor="middle" font-size="20" fill="#F39C45" font-weight="700">不满足目标：返回调谐波形参数</text>
    <rect x="180" y="665" width="1240" height="120" rx="28" fill="#123B5D" filter="url(#shadow)"/>
    <text x="800" y="713" text-anchor="middle" font-size="28" font-weight="700" fill="#FFFFFF">输出：波形—滤波器参数对</text>
    <text x="800" y="755" text-anchor="middle" font-size="21" fill="#D8F0F7">不只压低峰值旁瓣，而是在多普勒、相位误差与带宽限制下降低总旁瓣能量</text>
    
  </g>
</svg>
