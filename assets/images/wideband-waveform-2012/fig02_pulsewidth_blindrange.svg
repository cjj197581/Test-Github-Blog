<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">脉宽、能量与盲距关系</title>
  <desc id="desc">用cT/2展示长脉冲的灵敏度收益与盲距代价。</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="5" result="offsetBlur"/>
      <feFlood flood-color="#123B5D" flood-opacity="0.12" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadowBlur"/>
      <feMerge><feMergeNode in="shadowBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1D78A8"/></marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E8F4FA"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif" fill="#17324D">
    
    <text x="92" y="78" font-size="24" font-weight="700" fill="#1D78A8" letter-spacing="2">PULSE-WIDTH PHYSICS · A 类原创图</text>
    <text x="92" y="132" font-size="44" font-weight="700">脉宽带来能量，也带来盲距</text>
    <line x1="92" y1="158" x2="1508" y2="158" stroke="#C7DCE7" stroke-width="2"/>
    <line x1="360" y1="210" x2="360" y2="785" stroke="#C7DCE7" stroke-width="3"/>
        <text x="100" y="280" font-size="29" font-weight="700">T = 1 μs</text>
        <rect x="360" y="245" data-pulse-us="1" width="12" height="64" rx="6" fill="#39B9C6"/>
        <text x="366" y="287" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF"></text>
        <line x1="360" y1="339" x2="372" y2="339" stroke="#F39C45" stroke-width="4"/><line x1="360" y1="331" x2="360" y2="347" stroke="#F39C45" stroke-width="3"/><line x1="372" y1="331" x2="372" y2="347" stroke="#F39C45" stroke-width="3"/>
        <text x="608" y="347" data-blind-label-us="1" text-anchor="start" font-size="23" fill="#F39C45" font-weight="700">Rₑ = cT/2 = 0.15 km</text>
        
            <path d="M 372 277 L 430 277" stroke="#39B9C6" stroke-width="3"/>
            <text x="442" y="285" font-size="20" fill="#17324D" font-weight="700">1 μs 发射能量单位</text>
            
        <text x="100" y="465" font-size="29" font-weight="700">T = 20 μs</text>
        <rect x="360" y="430" data-pulse-us="20" width="240" height="64" rx="10" fill="#1D78A8"/>
        <text x="480" y="472" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">发射能量 ∝ T</text>
        <path d="M 360 524 L 600 524" stroke="#F39C45" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <text x="638" y="532" data-blind-label-us="20" text-anchor="start" font-size="23" fill="#F39C45" font-weight="700">Rₑ = cT/2 = 3.00 km</text>
        
        <text x="100" y="650" font-size="29" font-weight="700">T = 40 μs</text>
        <rect x="360" y="615" data-pulse-us="40" width="480" height="64" rx="10" fill="#123B5D"/>
        <text x="600" y="657" text-anchor="middle" font-size="19" font-weight="700" fill="#FFFFFF">发射能量 ∝ T</text>
        <path d="M 360 709 L 840 709" stroke="#F39C45" stroke-width="5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
        <text x="980" y="752" data-blind-label-us="40" text-anchor="end" font-size="23" fill="#F39C45" font-weight="700">Rₑ = cT/2 = 6.00 km</text>
        
    <rect x="1030" y="225" width="450" height="185" rx="22" fill="#FFFFFF" stroke="#C7DCE7" stroke-width="2" filter="url(#shadow)"/>
<rect x="1030" y="225" width="10" height="185" rx="5" fill="#39B9C6"/>
<text x="1064" y="273" font-size="27" font-weight="700">收益</text>
<text x="1064" y="313" font-size="20" fill="#60798E">同峰值功率下，发射能量 E ∝ PₜT</text>
<text x="1064" y="347" font-size="20" fill="#60798E">更长 T 改善最小可探测反射率</text>
    <rect x="1030" y="475" width="450" height="185" rx="22" fill="#FFFFFF" stroke="#C7DCE7" stroke-width="2" filter="url(#shadow)"/>
<rect x="1030" y="475" width="10" height="185" rx="5" fill="#F39C45"/>
<text x="1064" y="523" font-size="27" font-weight="700">代价</text>
<text x="1064" y="563" font-size="20" fill="#60798E">发射期间不能接收</text>
<text x="1064" y="597" font-size="20" fill="#60798E">单脉冲盲距与 T 成正比</text>
    <rect x="1018" y="710" width="474" height="86" rx="18" fill="#E8F4FA" stroke="#1D78A8" stroke-width="2"/>
    <text x="1255" y="746" text-anchor="middle" font-size="22" font-weight="700">脉压解耦了“长 T”与“细分辨率”</text>
    <text x="1255" y="777" text-anchor="middle" font-size="19" fill="#60798E">但盲区仍需靠后置短子脉冲补齐</text>
    
  </g>
</svg>
